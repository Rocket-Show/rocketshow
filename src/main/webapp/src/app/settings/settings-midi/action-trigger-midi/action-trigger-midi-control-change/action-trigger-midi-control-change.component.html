<div class="form-group row">
  <label class="col-md-3 col-form-label">{{
    "settings.midi-control-controller" | translate
  }}</label>
  <div class="col-md-9">
    <select
      class="custom-select"
      [ngModel]="trigger.controller"
      (ngModelChange)="trigger.controller = $event"
      >
      @for (controller of controllerList; track controller) {
        <option [ngValue]="controller">
          {{ controller }}
        </option>
      }
    </select>
  </div>
</div>

<div class="form-group row">
  <label class="col-md-3 col-form-label">{{
    "settings.midi-control-value" | translate
    }}<i class="fa fa-question-circle-o text-muted ml-1" style="cursor: help;"
      [popover]="'settings.help.midi-control-value' | translate" triggers="mouseenter:mouseleave" container="body"
      placement="right" aria-hidden="true"></i></label>
  <div class="col-md-9">
    <input type="number" class="form-control" min="0" max="127" [ngModel]="trigger.value"
      (ngModelChange)="trigger.value = $event" placeholder="{{ 'settings.midi-control-value-any' | translate }}" />
  </div>
</div>
