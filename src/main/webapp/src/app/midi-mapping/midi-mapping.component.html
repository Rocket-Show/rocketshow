<div class="form-group row">
  <label for="channel-offset" class="col-form-label" [ngClass]="stacked ? 'col-12 pt-0' : 'col-sm-3'">{{ 'routing.channel-offset' | translate }}</label>
  <div [ngClass]="stacked ? 'col-12' : 'col-sm-9'">
    <input type="text" [ngModel]="midiMapping?.channelOffset" (ngModelChange)="midiMapping.channelOffset = $event"
      class="form-control" id="channel-offset">
  </div>
</div>
<div class="form-group row mb-0">
  <label for="note-offset" class="col-form-label" [ngClass]="stacked ? 'col-12 pt-0' : 'col-sm-3'">{{ 'routing.note-offset' | translate }}</label>
  <div [ngClass]="stacked ? 'col-12' : 'col-sm-9'">
    <input type="text" [ngModel]="midiMapping?.noteOffset" (ngModelChange)="midiMapping.noteOffset = $event"
      class="form-control" id="note-offset">
  </div>
</div>
