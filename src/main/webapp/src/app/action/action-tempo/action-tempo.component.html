<div class="form-group row">
  <label class="col-md-3 col-form-label">{{
    "action.tempo.type" | translate
  }}</label>
  <div class="col-md-9">
    <select class="custom-select" [(ngModel)]="action.tempoActionType">
      @for (type of typeList; track type) {
        <option value="{{ type }}">
          {{ "action.tempo.type-enum." + type | translate }}
        </option>
      }
    </select>
  </div>
</div>

@if (action.tempoActionType === 'SET') {
  <div class="form-group row">
    <label class="col-md-3 col-form-label">{{
      "action.tempo.beats-per-minute" | translate
    }}</label>
    <div class="col-md-9">
      <input type="number" min="20" max="300" step="0.1" class="form-control" [ngModel]="action.beatsPerMinute"
        (ngModelChange)="setBeatsPerMinute($event)" />
    </div>
  </div>
}

<div class="form-group row">
  <div class="col-md-9 offset-md-3">
    <small class="form-text text-muted">{{ "action.tempo.help." + action.tempoActionType | translate }}</small>
  </div>
</div>
