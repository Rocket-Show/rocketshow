name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit tests
    # Pull requests from branches of this repository are already tested by the push
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run the unit tests
        run: ./mvnw -B test -Pcoverage -Dskip.npm -Dskip.installnodenpm
      - name: Summarize the coverage
        run: |
          awk -F, 'NR > 1 { missed += $8; covered += $9 } END { printf "Line coverage of the unit tests: %.1f %%\n", 100 * covered / (covered + missed) }' \
            target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: target/surefire-reports
          retention-days: 14

  build:
    name: Build with web app
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('src/main/webapp/package-lock.json') }}
      - name: Build the application including the web app
        run: ./mvnw -B package -DskipTests
      - uses: actions/upload-artifact@v4
        with:
          name: rocketshow-jar
          path: target/rocketshow.jar
          retention-days: 14

  smoke:
    name: Web app smoke test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: rocketshow-jar
          path: ${{ runner.temp }}/unit
      - name: Install the browser
        working-directory: testing/smoke
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Start a new unit
        working-directory: ${{ runner.temp }}/unit
        run: |
          # Installed next to the app on a unit, like by dist/install
          cp "$GITHUB_WORKSPACE/dist/designer_template.json" .
          nohup java -jar rocketshow.jar > rocketshow.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://localhost:8080/api/system/health > /dev/null && exit 0
            sleep 1
          done
          cat rocketshow.log
          exit 1
      - name: Run the smoke test
        working-directory: testing/smoke
        run: node smoke.mjs
        env:
          BASE_URL: http://localhost:8080
          SCREENSHOT_DIRECTORY: ${{ runner.temp }}/screenshots
      - name: Collect the log of the unit
        if: always()
        run: cp ${{ runner.temp }}/unit/rocketshow.log ${{ runner.temp }}/screenshots/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: ${{ runner.temp }}/screenshots
          retention-days: 14

  release-sample:
    name: Release sample
    # Releases are built from master. Their sample files are loaded by the tests of every later release, see
    # testing/README.md.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Generate the sample of the release, if missing
        id: sample
        run: |
          release=$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout | sed 's/-SNAPSHOT$//')
          echo "release=$release" >> "$GITHUB_OUTPUT"
          if [ -d "src/test/resources/compat/$release" ]; then
            echo "The sample of release $release is in src/test/resources/compat/$release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ./mvnw -B test -Dskip.npm -Dskip.installnodenpm -Dtest=ReleaseSampleGenerator -Dsample.release="$release"
          echo "missing=true" >> "$GITHUB_OUTPUT"
      - name: Load the new sample like the next releases
        if: steps.sample.outputs.missing == 'true'
        run: ./mvnw -B test -Dskip.npm -Dskip.installnodenpm -Dtest='CompatibilityTest,DesignerProjectCompatibilityTest,DefaultSettingsServiceTest,ReleaseSampleStartTest,ReleaseSamplesStartTest'
      - uses: actions/upload-artifact@v4
        if: steps.sample.outputs.missing == 'true'
        with:
          name: release-sample-${{ steps.sample.outputs.release }}
          path: src/test/resources/compat/${{ steps.sample.outputs.release }}
          retention-days: 90
      - name: Ask for the sample
        if: steps.sample.outputs.missing == 'true'
        run: |
          release=${{ steps.sample.outputs.release }}
          echo "::warning::The sample of release $release is missing. Commit the artifact release-sample-$release into src/test/resources/compat/$release."
          echo "The sample of release $release is missing: download the artifact release-sample-$release, unpack it into src/test/resources/compat/$release and commit it." >> "$GITHUB_STEP_SUMMARY"
