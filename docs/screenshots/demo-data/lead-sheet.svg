  <g font-size="26" fill="#666" font-style="italic">
    <text x="110" y="820">×2, second time into the chorus</text>
    <text x="110" y="1140">After the 2nd chorus: bridge, then one bar of the "Hit"</text>
    <text x="110" y="1590">Hold the last chord, let it ring</text>
